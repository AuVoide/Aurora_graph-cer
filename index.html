<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aurora Graphicer | Ultimate Studio</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- LIBRARIES -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/simple-statistics@7.8.3/dist/simple-statistics.min.js"></script>

    <style>
        :root {
            --bg: #000000;
            --glass: rgba(15, 23, 42, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #8b5cf6;
            --gold: #fbbf24;
            --text: #f8fafc;
            --font: 'Outfit', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* LOGIN WARP */
        #loginScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.8s cubic-bezier(0.7, 0, 0.3, 1);
        }

        #loginScreen.hidden {
            transform: translateY(-120%);
            opacity: 0;
            pointer-events: none;
        }

        .warp-canvas {
            position: absolute;
            inset: 0;
            opacity: 0.4;
        }

        .login-card {
            width: 350px;
            padding: 40px;
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 0 80px rgba(139, 92, 246, 0.3);
            z-index: 10;
        }

        .key-input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--gold);
            text-align: center;
            font-family: var(--mono);
            font-size: 1.5rem;
            letter-spacing: 5px;
            margin: 20px 0;
        }

        .btn-enter {
            width: 100%;
            padding: 15px;
            background: white;
            color: black;
            font-weight: 800;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-enter:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px white;
        }

        /* APP */
        .app-shell {
            display: flex;
            height: 100%;
            opacity: 0;
            transition: 1s 0.6s;
            overflow: hidden;
            position: relative;
        }

        .app-shell.visible {
            opacity: 1;
        }

        /* SIDEBAR (Tools) */
        .sidebar {
            width: 320px;
            background: var(--glass);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(20px);
            z-index: 100;
            transition: transform 0.3s;
        }

        .sb-head {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 800;
            letter-spacing: -1px;
        }

        .pro-tag {
            background: var(--gold);
            color: black;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            display: none;
        }

        .pro-tag.active {
            display: inline-block;
        }

        .sb-body {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-label {
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 10px;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            transition: 0.2s;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border-color: var(--primary);
        }

        .tool-btn:active {
            transform: scale(0.95);
        }

        .tool-btn i {
            margin-bottom: 2px;
        }

        /* WORKSPACE */
        .workspace {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1500px;
            overflow: hidden;
        }

        .chart-stage {
            width: 80%;
            max-width: 900px;
            aspect-ratio: 16/9;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            transition: transform 0.1s;
            transform-style: preserve-3d;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        /* EXPORT DOCK */
        .export-dock {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 20px;
            display: flex;
            gap: 15px;
            z-index: 50;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .dock-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            gap: 4px;
        }

        .dock-btn:hover {
            transform: translateY(-5px);
            color: var(--primary);
        }

        .dock-btn i {
            width: 24px;
            height: 24px;
        }

        /* OVERLAYS */
        .draw-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .draw-layer.active {
            pointer-events: all;
            cursor: crosshair;
        }

        .ai-text {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            padding: 10px;
            font-size: 0.85rem;
            resize: none;
        }

        /* RESPONSIVE */
        .mobile-nav {
            display: none;
            height: 60px;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(0, 0, 0, 0.9);
            z-index: 200;
            width: 100%;
            border-bottom: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .app-shell {
                flex-direction: column;
            }

            .mobile-nav {
                display: flex;
            }

            .sidebar {
                position: fixed;
                inset: 0;
                top: 60px;
                transform: translateX(-100%);
                width: 100%;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .export-dock {
                width: 90%;
                justify-content: space-around;
                bottom: 10px;
                padding: 10px;
            }

            .chart-stage {
                width: 95%;
                margin-bottom: 80px;
            }
        }
    </style>
</head>

<body>

    <!-- AUTH -->
    <div id="loginScreen">
        <canvas id="starfield" class="warp-canvas"></canvas>
        <div class="login-card">
            <h1 style="color:white; font-weight:800; margin-bottom:5px;">AURORA</h1>
            <p style="color:#94a3b8; margin-bottom:20px;">GRAPHICER ULTIMATE</p>
            <input type="password" id="keyIn" class="key-input" placeholder="KEY">
            <button class="btn-enter" onclick="auth()">GİRİŞ</button>
            <div onclick="enter(false)" style="margin-top:20px; color:#64748b; font-size:0.8rem; cursor:pointer;">
                Misafir Girişi</div>
        </div>
    </div>

    <!-- APP -->
    <div class="app-shell" id="app">
        <!-- MOBILE NAV -->
        <div class="mobile-nav">
            <button class="dock-btn" onclick="toggleMenu()"><i data-lucide="menu"></i></button>
            <span style="font-weight:700;">AURORA</span>
            <button class="dock-btn" onclick="toggleVoice()"><i data-lucide="mic"></i></button>
        </div>

        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="sb-head">
                <span class="logo">AURORA <span class="pro-tag" id="proTag">PRO</span></span>
                <button class="tool-btn" onclick="toggleMenu()" style="border:none; background:transparent;"><i
                        data-lucide="x"></i></button>
            </div>
            <div class="sb-body">

                <!-- 1. AI SUITE -->
                <div>
                    <div class="section-label">AI ENGINE</div>
                    <textarea id="aiIn" class="ai-text" placeholder="Veri Tarifi (Örn: 2024 Satışlar)..."></textarea>
                    <div class="grid-2" style="margin-top:10px;">
                        <button class="tool-btn" onclick="askAi('gen')"><i data-lucide="wand-2"></i> Oluştur</button>
                        <button class="tool-btn" onclick="askAi('rep')"><i data-lucide="file-text"></i> Raporla</button>
                    </div>
                </div>

                <!-- 2. DATA TOOLS (Features 5-10) -->
                <div>
                    <div class="section-label">VERİ & İŞLEM</div>
                    <div class="grid-3">
                        <button class="tool-btn" onclick="document.getElementById('csvIn').click()"><i
                                data-lucide="file-spreadsheet"></i> CSV</button>
                        <button class="tool-btn" onclick="editTable()"><i data-lucide="table"></i> Tablo</button>
                        <button class="tool-btn" onclick="randomizeData()"><i data-lucide="shuffle"></i>
                            Rastgele</button>
                        <button class="tool-btn" onclick="sortData()"><i data-lucide="arrow-up-down"></i>
                            Sırala</button>
                        <button class="tool-btn" onclick="addTrend()"><i data-lucide="trending-up"></i> Trend</button>
                        <button class="tool-btn" onclick="smooth()"><i data-lucide="activity"></i> Yumuşat</button>
                    </div>
                </div>

                <!-- 3. VISUALS (Features 11-16) -->
                <div>
                    <div class="section-label">GÖRSEL SETİ</div>
                    <div class="grid-3">
                        <button class="tool-btn" onclick="toggle3D()"><i data-lucide="box"></i> 3D Mod</button>
                        <button class="tool-btn" onclick="toggleGrid()"><i data-lucide="grid"></i> Izgara</button>
                        <button class="tool-btn" onclick="changeTheme()"><i data-lucide="palette"></i> Tema</button>
                        <button class="tool-btn" onclick="toggleDraw()"><i data-lucide="pencil"></i> Çizim</button>
                        <button class="tool-btn" onclick="toggleAnnotate()"><i data-lucide="message-square"></i>
                            Not</button>
                        <button class="tool-btn" onclick="toggleFullscreen()"><i data-lucide="maximize"></i>
                            Full</button>
                    </div>
                    <div style="margin-top:10px;">
                        <select id="typeSel" class="ai-text" style="height:40px;" onchange="updateType()">
                            <option value="bar">Bar (Sütun)</option>
                            <option value="line">Line (Çizgi)</option>
                            <option value="doughnut">Doughnut</option>
                            <option value="radar">Radar</option>
                            <option value="polarArea">Polar</option>
                        </select>
                    </div>
                </div>

            </div>
        </div>

        <!-- STAGE -->
        <div class="workspace" id="space">
            <div class="chart-stage" id="stage">
                <canvas id="mainChart"></canvas>
                <canvas id="drawLayer" class="draw-layer"></canvas> <!-- Feature 19 -->
            </div>

            <!-- EXPORT DOCK (Features 20-25) -->
            <div class="export-dock">
                <button class="dock-btn" onclick="saveAur()"><i data-lucide="save"></i> <span>Kaydet</span></button>
                <button class="dock-btn" onclick="openAur()"><i data-lucide="folder-open"></i> <span>Aç</span></button>
                <div style="width:1px; background:rgba(255,255,255,0.2);"></div>
                <button class="dock-btn" onclick="dl('png')"><i data-lucide="image"></i> <span>PNG</span></button>
                <button class="dock-btn" onclick="dl('vid')"><i data-lucide="video"></i> <span>Video</span></button>
                <button class="dock-btn" onclick="share()"><i data-lucide="share-2"></i> <span>Paylaş</span></button>
            </div>
        </div>
    </div>

    <!-- HIDDEN I/O -->
    <input type="file" id="csvIn" accept=".csv" hidden onchange="readCsv(this)">
    <input type="file" id="aurIn" accept=".aur,.json" hidden onchange="readAur(this)">

    <script>
        lucide.createIcons();
        const GROQ = "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";

        // STATE
        let IS_PRO = false;
        let chart;
        let chartData = { labels: ['A', 'B', 'C'], values: [10, 20, 15], title: 'Grafik' };
        let config = { type: 'bar', color: '#8b5cf6', theme: 0 };

        // AUTH
        function auth() {
            const k = document.getElementById('keyIn').value;
            if (k === 'w') { IS_PRO = true; enter(true); }
            else { alert('Hata.'); enter(false); }
        }
        function enter(pro) {
            document.getElementById('loginScreen').classList.add('hidden');
            setTimeout(() => document.getElementById('app').classList.add('visible'), 500);
            if (pro) {
                document.getElementById('proTag').classList.add('active');
                document.documentElement.style.setProperty('--primary', '#fbbf24'); // Gold
            }
        }

        // CHART INIT
        function init() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartData.labels,
                    datasets: [{
                        label: 'Veri',
                        data: chartData.values,
                        backgroundColor: IS_PRO ? 'rgba(251,191,36,0.6)' : 'rgba(139,92,246,0.6)',
                        borderColor: IS_PRO ? '#fbbf24' : '#8b5cf6',
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: 'white' } },
                        title: { display: true, text: 'Aurora Graphics', color: 'white', font: { size: 16 } }
                    },
                    scales: {
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#aaa' } },
                        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#aaa' } }
                    }
                }
            });
        }
        setTimeout(init, 800);

        // --- 3D PARALLAX (Feature 9) ---
        const space = document.getElementById('space');
        const stage = document.getElementById('stage');
        let is3D = false;

        function toggle3D() {
            is3D = !is3D;
            if (!is3D) stage.style.transform = 'none';
        }

        space.addEventListener('mousemove', (e) => {
            if (!is3D) return;
            const x = (window.innerWidth / 2 - e.clientX) / 25;
            const y = (window.innerHeight / 2 - e.clientY) / 25;
            stage.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });

        // --- FEATURES IMPL ---

        // AI (1, 2, 3)
        async function askAi(mode) {
            if (!IS_PRO) return alert("AI sadece Pro sürümde (Key: w)");
            const p = document.getElementById('aiIn').value;
            if (!p && mode === 'gen') return alert("Veri tarifi yazın");

            const sys = mode === 'gen' ?
                "Return JSON {labels:[], values:[], title:''} from text." :
                "Analyze this JSON data and give short insights (Turkish).";

            try {
                const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${GROQ}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "system", content: sys }, { role: "user", content: mode === 'gen' ? p : JSON.stringify(chartData) }]
                    })
                });
                const d = await r.json();
                const txt = d.choices[0].message.content;

                if (mode === 'gen') {
                    const j = JSON.parse(txt.match(/\{[\s\S]*\}/)[0]);
                    chartData = j; update();
                } else {
                    alert("RAPOR:\n" + txt);
                }
            } catch (e) { alert("AI Hatası"); }
        }

        // DATA (5, 14, 15, 16)
        function update() {
            chart.data.labels = chartData.labels;
            chart.data.datasets[0].data = chartData.values;
            chart.update();
        }
        function readCsv(el) {
            Papa.parse(el.files[0], {
                complete: r => {
                    chartData.labels = r.data.map(x => x[0]).slice(1);
                    chartData.values = r.data.map(x => parseFloat(x[1]) || 0).slice(1);
                    update();
                }
            });
        }
        function randomizeData() {
            chartData.values = chartData.values.map(() => Math.floor(Math.random() * 100));
            update();
        }
        function sortData() {
            // Pair, sort, unzip
            const p = chartData.labels.map((l, i) => ({ l, v: chartData.values[i] }));
            p.sort((a, b) => b.v - a.v);
            chartData.labels = p.map(x => x.l); chartData.values = p.map(x => x.v);
            update();
        }
        function addTrend() {
            const x = chartData.values.map((v, i) => [i, v]);
            const l = ss.linearRegressionLine(ss.linearRegression(x));
            chart.data.datasets[1] = {
                label: 'Trend', data: chartData.labels.map((_, i) => l(i)), type: 'line',
                borderColor: '#ef4444', borderDash: [5, 5], pointRadius: 0
            };
            chart.update();
        }
        function smooth() { chart.data.datasets[0].tension = 0.5; chart.update(); }

        // VISUAL (10, 11, 12, 19)
        const themes = [['#000', '#fff'], ['#fff', '#000'], ['#0f172a', '#cbd5e1']];
        let tI = 0;
        function changeTheme() {
            tI = (tI + 1) % themes.length;
            document.documentElement.style.setProperty('--bg', themes[tI][0]);
            document.documentElement.style.setProperty('--text', themes[tI][1]);
        }
        function updateType() {
            config.type = document.getElementById('typeSel').value;
            chart.config.type = config.type; chart.update();
        }
        function toggleGrid() {
            const v = chart.options.scales.y.grid.display !== false;
            chart.options.scales.y.grid.display = !v;
            chart.options.scales.x.grid.display = !v;
            chart.update();
        }

        // EXPORT (20-23)
        function saveAur() {
            const b = new Blob([JSON.stringify(chartData)], { type: 'application/json' });
            dlBlob(b, 'project.aur');
        }
        function openAur() { document.getElementById('aurIn').click(); }
        function readAur(el) {
            const r = new FileReader();
            r.onload = e => { chartData = JSON.parse(e.target.result); update(); };
            r.readAsText(el.files[0]);
        }
        function dl(type) {
            if (!IS_PRO) return alert("İndirme sadece Pro (Key: w)");
            if (type === 'png') {
                const a = document.createElement('a');
                a.href = document.getElementById('mainChart').toDataURL('image/png', 1.0);
                a.download = 'chart.png'; a.click();
            }
            if (type === 'vid') {
                alert("Video kaydediliyor (3sn)...");
                const s = document.getElementById('mainChart').captureStream(30);
                const r = new MediaRecorder(s); const c = [];
                r.ondataavailable = e => c.push(e.data);
                r.onstop = () => { dlBlob(new Blob(c, { type: 'video/webm' }), 'video.webm'); };
                r.start(); setTimeout(() => r.stop(), 3000);
            }
        }
        function dlBlob(b, n) { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = n; a.click(); }
        function share() { if (navigator.share) navigator.share({ title: 'Grafik', text: 'Bak!', url: location.href }); }

        // DRAW
        let drawing = false;
        function toggleDraw() {
            const c = document.getElementById('drawLayer');
            c.classList.toggle('active');
            c.width = c.offsetWidth; c.height = c.offsetHeight;
            const cx = c.getContext('2d'); cx.strokeStyle = 'red'; cx.lineWidth = 3;

            c.onmousedown = e => { drawing = true; cx.beginPath(); cx.moveTo(e.offsetX, e.offsetY); };
            c.onmousemove = e => { if (drawing) cx.lineTo(e.offsetX, e.offsetY); cx.stroke(); };
            c.onmouseup = () => drawing = false;
        }

        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
        function toggleFullscreen() { document.documentElement.requestFullscreen(); }

        // VOICE
        function toggleVoice() {
            if (!('webkitSpeechRecognition' in window)) return;
            const r = new webkitSpeechRecognition(); r.lang = 'tr-TR'; r.start();
            r.onresult = e => {
                const t = e.results[0][0].transcript;
                if (t.includes('kırmızı')) chart.data.datasets[0].backgroundColor = 'red';
                if (t.includes('mavi')) chart.data.datasets[0].backgroundColor = 'blue';
                chart.update();
            };
        }

        // STARFIELD ANIM
        const cv = document.getElementById('starfield');
        const cx = cv.getContext('2d');
        let w, h, stars = [];
        function sz() { w = cv.width = window.innerWidth; h = cv.height = window.innerHeight; }
        window.onresize = sz; sz();
        for (let i = 0; i < 100; i++) stars.push({ x: Math.random() * w, y: Math.random() * h, z: Math.random() });
        function anim() {
            cx.fillStyle = '#000'; cx.fillRect(0, 0, w, h);
            cx.fillStyle = '#fff';
            stars.forEach(s => {
                s.x -= s.z; if (s.x < 0) s.x = w;
                cx.globalAlpha = s.z; cx.fillRect(s.x, s.y, 2, 2);
            });
            requestAnimationFrame(anim);
        }
        anim();

    </script>
</body>

</html>
